version: '3.8'
networks:
  working:
    driver: bridge
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicemt
    restart: unless-stopped
    working_dir: /app
    networks:
      - working
    volumes:
      - .:/app
    depends_on:
      postgresdb:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgresdb
      - DB_PORT=5432
      - DB_DATABASE=servicemt
      - DB_USERNAME=servicemt
      - DB_PASSWORD=123456
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=bucketapi
      - AWS_ENDPOINT=http://minio:9000
  postgresdb:
    image: postgres:latest
    container_name: postgresdb
    restart: unless-stopped
    networks:
      - working
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=servicemt
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=servicemt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "servicemt"]
      interval: 10s
      retries: 5
      start_period: 20s
  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000" 
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    networks:
      - working
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
      start_period: 20s
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc ls local/bucketapi || mc mb local/bucketapi;
      "
    networks:
      - working
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_BUCKET=bucketapi

volumes:
  postgres_data:
  minio_data:
